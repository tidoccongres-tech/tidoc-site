<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{
  --blue:#198CA7;

  --blue-light:#E9F7FA;

/* =====================================================
   BASE
===================================================== */

  padding:0;

}


html{

body{

}


a{

}


img{

}



/* =====================================================
   HEADER
===================================================== */

header{

  left:0;

  width:100%;

  padding:
    22px 7%;

.logo img{

}


nav{

/* =====================================================

.page{

}


.container{

  width:

/* =====================================================

===================================================== */

}


.page-tag{

  font-weight:

  text-transform:

}


.page-heading h1{

  margin-top:

  font-size:

.page-heading p{

===================================================== */

/* =====================================================

<script>

/* =====================================================
   API
===================================================== */

const BILLETTERIE_API =
  "https://script.google.com/macros/s/AKfycbwsovttBzH6546XYsnGE6fz4piiqOkZ1vD_0YZHE4nUhFz7BhB7limxAcbrvE-Sz41q/exec";


/* =====================================================
   TOKEN
===================================================== */

function getTokenFromUrl(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  return String(
    params.get("token") || ""
  ).trim();

}



/* =====================================================
   CHARGER LE BILLET
===================================================== */

async function loadTicket(){

  const container =
    document.getElementById(
      "ticket-container"
    );


  const token =
    getTokenFromUrl();


  if(!token){

    container.innerHTML = `

      <div class="error-box">

        Ce lien de billet n'est pas valide.

      </div>

    `;

    return;

  }


  try{

    const response =
      await fetch(

        BILLETTERIE_API +
        "?action=billet&token=" +
        encodeURIComponent(
          token
        )

      );


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.message ||
        "Impossible de charger ce billet."
      );

    }


    renderTicket(
      result.data
    );

  }


  catch(error){

    console.error(error);


    container.innerHTML = `

      <div class="error-box">

        Impossible de charger votre billet.

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

  }

}

/* =====================================================
   TRI DES HORAIRES
===================================================== */

function timeToMinutes(
  value
){

  const text =
    String(
      value || ""
    ).trim();


  const match =
    text.match(
      /(\d{1,2})[:hH](\d{2})/
    );


  if(!match){

    return 99999;

  }


  return (
    Number(match[1]) * 60 +
    Number(match[2])
  );

}



/* =====================================================
   CRÉER L'EMPLOI DU TEMPS
===================================================== */

function buildScheduleHtml(
  reservations
){

  const activities =
    reservations.filter(
      item =>
        item.day ||
        item.startTime
    );


  if(
    activities.length === 0
  ){

    return `

      <section class="schedule-card">

        <div class="schedule-heading">

          <span>
            Votre planning
          </span>

          <h3>
            Mon emploi du temps
          </h3>

          <p>
            Les horaires apparaîtront ici
            dès que le programme détaillé
            aura été publié.
          </p>

        </div>

        <div class="schedule-empty">
          Le planning détaillé arrive bientôt 💙
        </div>

      </section>

    `;

  }


  const grouped =
    {};


  activities.forEach(
    function(item){

      const day =
        String(
          item.day ||
          "À définir"
        ).trim();


      if(
        !grouped[day]
      ){

        grouped[day] =
          [];

      }


      grouped[day].push(
        item
      );

    }
  );


  Object
    .values(grouped)
    .forEach(
      function(items){

        items.sort(
          function(a,b){

            return (
              timeToMinutes(
                a.startTime
              )
              -
              timeToMinutes(
                b.startTime
              )
            );

          }
        );

      }
    );


  const daysHtml =
    Object
      .entries(grouped)
      .map(
        function(
          [day, items]
        ){

          const activitiesHtml =
            items
              .map(
                function(item){

                  let timeText =
                    item.startTime ||
                    "Horaire à définir";


                  if(
                    item.startTime &&
                    item.endTime
                  ){

                    timeText =
                      item.startTime +
                      " – " +
                      item.endTime;

                  }


                  return `

                    <div class="schedule-item">

                      <div class="schedule-time">

                        ${escapeHtml(
                          item.startTime ||
                          "—"
                        )}

                      </div>


                      <div class="schedule-line">

                        <div class="schedule-dot"></div>

                      </div>


                      <div class="schedule-activity">

                        <span class="schedule-type">

                          ${escapeHtml(
                            item.type
                          )}

                        </span>


                        <h4>

                          ${escapeHtml(
                            item.name
                          )}

                        </h4>


                        <div class="schedule-meta">

                          <span class="schedule-pill">

                            🕒
                            ${escapeHtml(
                              timeText
                            )}

                          </span>


                          ${
                            item.room
                              ? `

                                <span class="schedule-pill">

                                  📍
                                  ${escapeHtml(
                                    item.room
                                  )}

                                </span>

                              `
                              : ""
                          }


                          ${
                            item.speaker
                              ? `

                                <span class="schedule-pill">

                                  🎤
                                  ${escapeHtml(
                                    item.speaker
                                  )}

                                </span>

                              `
                              : ""
                          }

                        </div>

                      </div>

                    </div>

                  `;

                }
              )
              .join("");


          return `

            <div class="schedule-day">

              <div class="schedule-day-header">

                <div class="schedule-day-name">

                  ${escapeHtml(
                    day
                  )}

                </div>


                <div class="schedule-day-count">

                  ${items.length}
                  activité(s)

                </div>

              </div>


              <div class="schedule-items">

                ${activitiesHtml}

              </div>

            </div>

          `;

        }
      )
      .join("");


  return `

    <section class="schedule-card">

      <div class="schedule-heading">

        <span>
          Votre planning
        </span>

        <h3>
          Mon emploi du temps
        </h3>

        <p>
          Retrouvez ici votre programme personnel,
          organisé par journée et par horaire.
        </p>

      </div>


      <div class="schedule-days">

        ${daysHtml}

      </div>

    </section>

  `;

}

/* =====================================================
   SÉCURITÉ
===================================================== */

function escapeHtml(
  value
){

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
){

  return escapeHtml(
    value
  );

}
