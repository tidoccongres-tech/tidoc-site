<!DOCTYPE html>
<html lang="fr">

<head>

  name="viewport"

<title>
  Mon programme — Ti'Doc 2027
</title>


<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{

  --blue:#198CA7;
  --blue-dark:#0B5367;
  --blue-deep:#073C4B;
  --blue-light:#E9F7FA;

  --text:#153C46;
  --grey:#637D84;

  --white:#FFFFFF;
  --light:#F7FBFC;
  --border:#DCECEF;

}


/* =====================================================
   BASE
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


html{
  scroll-behavior:smooth;
}


body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    var(--light);

  color:
    var(--text);

  overflow-x:hidden;

}


a{
  text-decoration:none;
}


img{
  display:block;
  max-width:100%;
}



/* =====================================================
   HEADER
===================================================== */

header{

  position:fixed;

  top:0;
  left:0;

  width:100%;

  z-index:1000;

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  padding:
    22px 7%;

  background:
    transparent;

}


/* =====================================================
   LOGO
===================================================== */

.logo img{

  width:
    82px;

}


/* =====================================================
   MENU
===================================================== */

nav{

  display:flex;

  align-items:center;

  gap:
    36px;

  padding:
    15px 25px;

  border-radius:
    50px;

  background:
    rgba(
      255,
      255,
      255,
      .92
    );

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  box-shadow:
    0 10px 35px
    rgba(
      0,
      0,
      0,
      .08
    );

}


nav a{

  color:
    var(--blue-dark);

  font-size:
    15px;

  font-weight:
    600;

  transition:
    color .25s ease;

}


nav a:hover{

  color:
    var(--blue);

}



/* =====================================================
   HERO
===================================================== */

.hero{

  padding:
    165px 7%
    65px;

  text-align:
    center;

  background:

    radial-gradient(
      circle
      at top right,
      rgba(
        25,
        140,
        167,
        .12
      ),
      transparent
      40%
    ),

    linear-gradient(
      180deg,
      #FFFFFF,
      #EEF8FA
    );

}


.hero-tag{

  display:inline-block;

  padding:
    9px 16px;

  border-radius:
    50px;

  background:
    var(--blue-light);

  color:
    var(--blue);

  font-size:
    12px;

  font-weight:
    800;

  letter-spacing:
    1.5px;

  text-transform:
    uppercase;

}


.hero h1{

  margin-top:
    18px;

  color:
    var(--blue-deep);

  font-size:
    clamp(
      40px,
      6vw,
      68px
    );

  line-height:
    1.05;

}


.hero p{

  max-width:
    700px;

  margin:
    20px auto 0;

  color:
    var(--grey);

  font-size:
    17px;

  line-height:
    1.7;

}



/* =====================================================
   CONTENU PRINCIPAL
===================================================== */

.main{

  padding:
    55px 7%
    110px;

}


.container{

  width:
    min(
      1120px,
      100%
    );

  margin:
    auto;

}



/* =====================================================
   CHARGEMENT / ERREUR
===================================================== */

.loading,
.error-box{

  padding:
    30px;

  border-radius:
    24px;

  background:
    white;

  text-align:
    center;

  box-shadow:
    0 12px 35px
    rgba(
      7,
      60,
      75,
      .08
    );

  color:
    var(--grey);

}


.error-box{

  color:
    #8B3D46;

  background:
    #FFF7F7;

}



/* =====================================================
   PARTICIPANT
===================================================== */

.profile-card{

  padding:
    28px;

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:
    20px;

  border-radius:
    26px;

  background:
    white;

  box-shadow:
    0 14px 40px
    rgba(
      7,
      60,
      75,
      .08
    );

}


.profile-card h2{

  color:
    var(--blue-deep);

  font-size:
    27px;

}


.profile-card p{

  margin-top:
    7px;

  color:
    var(--grey);

  font-size:
    14px;

}



/* =====================================================
   BADGE PACK
===================================================== */

.pack-badge{

  padding:
    15px 19px;

  border-radius:
    18px;

  background:
    var(--blue-light);

  text-align:
    right;

}


.pack-badge small{

  display:block;

  color:
    var(--grey);

  font-size:
    10px;

  text-transform:
    uppercase;

  letter-spacing:
    1px;

}


.pack-badge strong{

  display:block;

  margin-top:
    5px;

  color:
    var(--blue-deep);

  font-size:
    18px;

}



/* =====================================================
   QUOTAS
===================================================== */

.quota-box{

  margin-top:
    22px;

  display:grid;

  grid-template-columns:
    repeat(
      2,
      1fr
    );

  gap:
    16px;

}


.quota{

  padding:
    22px;

  border-radius:
    22px;

  background:
    white;

  box-shadow:
    0 10px 30px
    rgba(
      7,
      60,
      75,
      .06
    );

}


.quota-number{

  color:
    var(--blue);

  font-size:
    32px;

  font-weight:
    900;

}


.quota-label{

  margin-top:
    5px;

  color:
    var(--grey);

  font-size:
    13px;

}



/* =====================================================
   RÉSERVATIONS FERMÉES
===================================================== */

.closed-box{

  margin-top:
    30px;

  padding:
    35px;

  border-radius:
    26px;

  background:
    var(--blue-deep);

  color:
    white;

  text-align:
    center;

}


.closed-icon{

  font-size:
    35px;

}


.closed-box h3{

  margin-top:
    13px;

  font-size:
    25px;

}


.closed-box p{

  max-width:
    650px;

  margin:
    12px auto 0;

  color:
    rgba(
      255,
      255,
      255,
      .78
    );

  line-height:
    1.65;

}



/* =====================================================
   SECTIONS
===================================================== */

.section{

  margin-top:
    50px;

}


.section-header{

  display:flex;

  align-items:flex-end;

  justify-content:
    space-between;

  gap:
    20px;

  margin-bottom:
    22px;

}


.section-header span{

  color:
    var(--blue);

  font-size:
    11px;

  font-weight:
    800;

  letter-spacing:
    1.5px;

  text-transform:
    uppercase;

}


.section-header h2{

  margin-top:
    7px;

  color:
    var(--blue-deep);

  font-size:
    34px;

}


.section-counter{

  color:
    var(--grey);

  font-size:
    13px;

  font-weight:
    700;

}



/* =====================================================
   GRILLE ACTIVITÉS
===================================================== */

.activity-grid{

  display:grid;

  grid-template-columns:
    repeat(
      2,
      1fr
    );

  gap:
    20px;

}



/* =====================================================
   CARTE ACTIVITÉ
===================================================== */

.activity-card{

  position:
    relative;

  padding:
    26px;

  border:
    2px solid
    transparent;

  border-radius:
    24px;

  background:
    white;

  box-shadow:
    0 10px 30px
    rgba(
      7,
      60,
      75,
      .07
    );

  cursor:
    pointer;

  transition:
    transform .2s ease,
    border-color .2s ease,
    background .2s ease;

}


.activity-card:hover{

  transform:
    translateY(
      -3px
    );

}


.activity-card.selected{

  border-color:
    var(--blue);

  background:
    #F3FBFC;

}


.activity-card.disabled{

  opacity:
    .5;

  cursor:
    not-allowed;

  transform:
    none;

}



/* =====================================================
   CONTENU CARTE
===================================================== */

.activity-top{

  display:flex;

  justify-content:
    space-between;

  gap:
    18px;

}


.activity-type{

  color:
    var(--blue);

  font-size:
    10px;

  font-weight:
    800;

  letter-spacing:
    1.3px;

  text-transform:
    uppercase;

}


.activity-title{

  margin-top:
    7px;

  color:
    var(--blue-deep);

  font-size:
    21px;

  line-height:
    1.3;

}



/* =====================================================
   CHECK
===================================================== */

.activity-check{

  width:
    30px;

  height:
    30px;

  min-width:
    30px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:
    50%;

  border:
    1px solid
    var(--border);

  color:
    white;

  background:
    white;

}


.activity-card.selected
.activity-check{

  border-color:
    var(--blue);

  background:
    var(--blue);

}



/* =====================================================
   DESCRIPTION
===================================================== */

.activity-description{

  margin-top:
    13px;

  color:
    var(--grey);

  font-size:
    14px;

  line-height:
    1.6;

}



/* =====================================================
   INFORMATIONS ACTIVITÉ
===================================================== */

.activity-meta{

  margin-top:
    18px;

  display:flex;

  flex-wrap:
    wrap;

  gap:
    8px;

}


.meta-pill{

  padding:
    7px 10px;

  border-radius:
    50px;

  background:
    var(--blue-light);

  color:
    var(--blue-dark);

  font-size:
    11px;

  font-weight:
    700;

}


.full-pill{

  background:
    #FFF0F0;

  color:
    #A14A4A;

}



/* =====================================================
   VALIDATION
===================================================== */

.save-zone{

  position:
    sticky;

  bottom:
    18px;

  margin-top:
    35px;

  padding:
    18px;

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:
    20px;

  border-radius:
    24px;

  background:
    rgba(
      255,
      255,
      255,
      .96
    );

  box-shadow:
    0 18px 50px
    rgba(
      7,
      60,
      75,
      .16
    );

  backdrop-filter:
    blur(10px);

}


.selection-summary{

  color:
    var(--grey);

  font-size:
    13px;

  line-height:
    1.6;

}


.save-button{

  padding:
    15px 24px;

  border:
    0;

  border-radius:
    50px;

  background:
    var(--blue);

  color:
    white;

  font-size:
    14px;

  font-weight:
    800;

  cursor:
    pointer;

  transition:
    .2s ease;

}


.save-button:hover{

  background:
    var(--blue-dark);

}


.save-button:disabled{

  opacity:
    .45;

  cursor:
    not-allowed;

}



/* =====================================================
   FOOTER
===================================================== */

footer{

  padding:
    35px 7%;

  text-align:
    center;

  background:
    var(--blue-deep);

  color:

      255,
      255,
      255,
      .72
    );

  font-size:

===================================================== */

@media(max-width:900px){

    padding:

  nav{

  .profile-card{

  header{

      column;

  }


  .save-button{

    width:
      100%;

  }

}

</style>

<!-- ==================================================

<main class="main">

  <div
    id="programme-container"
    class="container"
  >

    <div class="loading">

      Chargement de votre espace Ti'Doc...

    </div>

  </div>

<footer>

<script>

/* =====================================================
   API BILLETTERIE
===================================================== */

const BILLETTERIE_API =
  "https://script.google.com/macros/s/AKfycbyqvpiD-w56XH_DGs2cZyZ41eEV8g4JpZArdI2IkmDKU_G0_rzwLsuW_Hq6pymAhhHQ/exec";



/* =====================================================
   ÉTAT LOCAL
===================================================== */

let programmeData =
  null;


let selectedConferences =
  [];


let selectedWorkshops =
  [];



/* =====================================================
   TOKEN
===================================================== */

function getTokenFromUrl(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  return String(
    params.get("token") || ""
  ).trim();

}



/* =====================================================
   CHARGER LE PROGRAMME
===================================================== */

async function loadProgramme(){

  const container =
    document.getElementById(
      "programme-container"
    );


  const token =
    getTokenFromUrl();


  if(!token){

    container.innerHTML = `

      <div class="error-box">

        Ce lien d'accès n'est pas valide.

        <br><br>

        Utilisez le lien personnel reçu
        après votre inscription.

      </div>

    `;


    return;

  }


  try{


    const url =
      BILLETTERIE_API +
      "?action=programme&token=" +
      encodeURIComponent(
        token
      );


    const response =
      await fetch(
        url
      );


    if(!response.ok){

      throw new Error(
        "Impossible de joindre la billetterie."
      );

    }


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.message ||
        "Impossible de charger votre programme."
      );

    }


    programmeData =
      result.data;


    renderProgramme();


  }


  catch(error){


    console.error(
      error
    );


    container.innerHTML = `

      <div class="error-box">

        Impossible d'ouvrir
        votre espace Ti'Doc.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}



/* =====================================================
   AFFICHAGE PRINCIPAL
===================================================== */

function renderProgramme(){

  const container =
    document.getElementById(
      "programme-container"
    );


  const participant =
    programmeData.participant;


  const pack =
    programmeData.pack;


  const config =
    programmeData.config;


  let html = `

    <div class="profile-card">

      <div>

        <h2>

          Bonjour
          ${escapeHtml(
            participant.firstName
          )}
          👋

        </h2>


        <p>

          ${escapeHtml(
            participant.email
          )}

        </p>

      </div>


      <div class="pack-badge">

        <small>
          Votre pack
        </small>

        <strong>

          ${escapeHtml(
            pack.name
          )}

        </strong>

      </div>

    </div>



    <div class="quota-box">


      <div class="quota">

        <div class="quota-number">

          ${pack.conferencesAllowed}

        </div>


        <div class="quota-label">

          conférence(s) incluse(s)

        </div>

      </div>



      <div class="quota">

        <div class="quota-number">

          ${pack.workshopsAllowed}

        </div>


        <div class="quota-label">

          workshop(s) inclus

        </div>

      </div>


    </div>

  `;



  /* ==================================================
     RÉSERVATIONS FERMÉES
  ================================================== */

  if(
    !config.reservationsOpen
  ){

    html += `

      <div class="closed-box">

        <div class="closed-icon">

          🔒

        </div>


        <h3>

          Les réservations ne sont
          pas encore ouvertes

        </h3>


        <p>

          ${escapeHtml(
            config.closedMessage
          )}

        </p>

      </div>

    `;


    container.innerHTML =
      html;


    return;

  }



  /* ==================================================
     CONFÉRENCES
  ================================================== */

  html += `

    <section class="section">

      <div class="section-header">

        <div>

          <span>
            Conférences
          </span>


          <h2>

            Choisissez vos conférences

          </h2>

        </div>


        <div
          id="conference-counter"
          class="section-counter"
        >

          0 /
          ${pack.conferencesAllowed}
          sélectionnée(s)

        </div>

      </div>


      <div
        id="conference-grid"
        class="activity-grid"
      >

        ${renderConferenceCards()}

      </div>

    </section>

  `;



  /* ==================================================
     WORKSHOPS
  ================================================== */

  if(
    Number(
      pack.workshopsAllowed
    ) > 0
  ){

    html += `

      <section class="section">

        <div class="section-header">

          <div>

            <span>
              Workshops
            </span>


            <h2>

              Choisissez vos workshops

            </h2>

          </div>


          <div
            id="workshop-counter"
            class="section-counter"
          >

            0 /
            ${pack.workshopsAllowed}
            sélectionné(s)

          </div>

        </div>


        <div
          id="workshop-grid"
          class="activity-grid"
        >

          ${renderWorkshopCards()}

        </div>

      </section>

    `;

  }



  /* ==================================================
     VALIDATION
  ================================================== */

  html += `

    <div class="save-zone">

      <div
        id="selection-summary"
        class="selection-summary"
      >

        Faites vos choix puis
        validez votre programme.

      </div>


      <button
        id="save-programme-button"
        class="save-button"
        type="button"
        onclick="saveProgramme()"
      >

        Valider mon programme →

      </button>

    </div>

  `;


  container.innerHTML =
    html;


  updateSelectionState();

}



/* =====================================================
   CARTES CONFÉRENCES
===================================================== */

function renderConferenceCards(){

  const conferences =
    programmeData.conferences ||
    [];


  if(
    conferences.length === 0
  ){

    return `

      <div class="loading">

        Aucune conférence n'est
        disponible pour le moment.

      </div>

    `;

  }


  return conferences

    .map(
      function(item){


        const id =
          String(

            item[
              "ID activité"
            ] ||

            item[
              "ID activite"
            ] ||

            item[
              "ID conférence"
            ] ||

            ""

          ).trim();



        const title =

          item[
            "Nom de la conférence"
          ] ||

          item[
            "Nom conférence"
          ] ||

          item[
            "Nom"
          ] ||

          item[
            "Titre"
          ] ||

          "Conférence";



        const description =

          item[
            "Description"
          ] ||

          "";



        const speaker =

          item[
            "Intervenant"
          ] ||

          "";



        const day =

          item[
            "Jour"
          ] ||

          "";



        const startTime =

          item[
            "Heure début"
          ] ||

          item[
            "Horaire"
          ] ||

          "";



        const endTime =

          item[
            "Heure fin"
          ] ||

          "";



        const room =

          item[
            "Salle"
          ] ||

          "";



        let timeText =
          startTime;


        if(
          startTime &&
          endTime
        ){

          timeText =
            startTime +
            " – " +
            endTime;

        }



        return `

          <article

            class="
              activity-card

===================================================== */

    programmeData.workshops ||
    [];


  if(
    workshops.length === 0
  ){

    return `

      <div class="loading">

        Aucun workshop n'est
        disponible pour le moment.

      </div>

    `;

  }


  return workshops

    .map(
      function(item){


        const id =
          String(

            item[
              "ID activité"
            ] ||

            item[
              "ID activite"
            ] ||

            item[
              "ID workshop"
            ] ||

            ""

          ).trim();



        const title =

          item[
            "Nom du workshop"
          ] ||

          item[
            "Nom workshop"
          ] ||

          item[
            "Nom"
          ] ||

          item[
            "Titre"
          ] ||

          "Workshop";



        const description =

          item[
            "Description"
          ] ||

          "";



        const speaker =

          item[
            "Intervenant"
          ] ||

          "";



        const day =

          item[
            "Jour"
          ] ||

          "";



        const startTime =

          item[
            "Heure début"
          ] ||

          item[
            "Horaire"
          ] ||

          "";



        const endTime =

          item[
            "Heure fin"
          ] ||

          "";



        const room =

          item[
            "Salle"
          ] ||

          "";



        let timeText =
          startTime;


        if(
          startTime &&
          endTime
        ){

          timeText =
            startTime +
            " – " +
            endTime;

        }



        const remaining =
          parseRemainingPlaces(
            item
          );


        const full =

          remaining !== null &&
          remaining <= 0;



        return `

          <article

            class="
              activity-card
              workshop-card
              ${full ? "disabled" : ""}
            "

            data-id="
              ${escapeHtml(id)}
            "

            ${
              full

                ? ""

                : `
                  onclick="
                    toggleWorkshop(
                      '${escapeJs(id)}'
                    )
                  "
                `
            }

          >


            <div class="activity-top">


              <div>

                <div class="activity-type">

                  Workshop

                </div>


                <h3 class="activity-title">

                  ${escapeHtml(
                    title
                  )}

                </h3>

              </div>


              <div class="activity-check">

                ✓

              </div>


            </div>



            ${
              description

                ? `

                  <p class="activity-description">

                    ${escapeHtml(
                      description
                    )}

                  </p>

                `

                : ""
            }



            <div class="activity-meta">


              ${
                speaker

                  ? `

                    <span class="meta-pill">

                      🎤
                      ${escapeHtml(
                        speaker
                      )}

                    </span>

                  `

                  : ""
              }


              ${
                day

                  ? `

                    <span class="meta-pill">

                      📅
                      ${escapeHtml(
                        day
                      )}

                    </span>

                  `

                  : ""
              }


              ${
                timeText

                  ? `

                    <span class="meta-pill">

                      🕒
                      ${escapeHtml(
                        timeText
                      )}

                    </span>

                  `

                  : ""
              }


              ${
                room

                  ? `

                    <span class="meta-pill">

                      📍
                      ${escapeHtml(
                        room
                      )}

                    </span>

                  `

                  : ""
              }


              ${
                remaining !== null

                  ? `

                    <span
                      class="
                        meta-pill
                        ${full ? "full-pill" : ""}
                      "
                    >

                      ${
                        full

                          ? "Complet"

                          : remaining +
                            " place(s) restante(s)"
                      }

                    </span>

                  `

                  : ""
              }


            </div>


          </article>

        `;

      }

    )

    .join("");

}



/* =====================================================
   PLACES RESTANTES
===================================================== */

function parseRemainingPlaces(
  item
){

  const possibleKeys = [

    "Places restantes",

    "Places restantes calculées",

    "Places disponibles"

  ];


  for(
    const key
    of possibleKeys
  ){

    if(

      item[key] !==
      undefined &&

      item[key] !==
      ""

    ){

      const cleaned =
        String(
          item[key]
        )

          .replace(
            /\s/g,
            ""
          )

          .replace(
            ",",
            "."
          );


      const number =
        Number(
          cleaned
        );


      if(
        !Number.isNaN(
          number
        )
      ){

        return number;

      }

    }

  }


  return null;

}



/* =====================================================
   SÉLECTION CONFÉRENCE
===================================================== */

function toggleConference(
  id
){

  if(!id){
    return;
  }


  const max =
    Number(
      programmeData
        .pack
        .conferencesAllowed
    );


  const index =
    selectedConferences
      .indexOf(
        id
      );


  if(
    index !==
    -1
  ){

    selectedConferences.splice(
      index,
      1
    );

  }


  else{


    if(
      selectedConferences.length >=
      max
    ){

      alert(

        "Votre pack permet de sélectionner " +
        max +
        " conférence(s) maximum."

      );


      return;

    }


    selectedConferences.push(
      id
    );

  }


  updateSelectionState();

}



/* =====================================================
   SÉLECTION WORKSHOP
===================================================== */

function toggleWorkshop(
  id
){

  if(!id){
    return;
  }


  const max =
    Number(
      programmeData
        .pack
        .workshopsAllowed
    );


  const index =
    selectedWorkshops
      .indexOf(
        id
      );


  if(
    index !==
    -1
  ){

    selectedWorkshops.splice(
      index,
      1
    );

  }


  else{


    if(
      selectedWorkshops.length >=
      max
    ){

      alert(

        "Votre pack permet de sélectionner " +
        max +
        " workshop(s) maximum."

      );


      return;

    }


    selectedWorkshops.push(
      id
    );

  }


  updateSelectionState();

}



/* =====================================================
   METTRE À JOUR L'INTERFACE
===================================================== */

function updateSelectionState(){


  document
    .querySelectorAll(
      ".conference-card"
    )
    .forEach(
      function(card){

        card
          .classList
          .toggle(

            "selected",

            selectedConferences
              .includes(
                card.dataset.id
              )

          );

      }

    );



  document
    .querySelectorAll(
      ".workshop-card"
    )
    .forEach(
      function(card){

        card
          .classList
          .toggle(

            "selected",

            selectedWorkshops
              .includes(
                card.dataset.id
              )

          );

      }

    );



  const conferenceCounter =
    document.getElementById(
      "conference-counter"
    );


  if(
    conferenceCounter
  ){

    conferenceCounter.textContent =

      selectedConferences.length +

      " / " +

      programmeData
        .pack
        .conferencesAllowed +

      " sélectionnée(s)";

  }



  const workshopCounter =
    document.getElementById(
      "workshop-counter"
    );


  if(
    workshopCounter
  ){

    workshopCounter.textContent =

      selectedWorkshops.length +

      " / " +

      programmeData
        .pack
        .workshopsAllowed +

      " sélectionné(s)";

  }



  const summary =
    document.getElementById(
      "selection-summary"
    );


  if(
    summary
  ){

    summary.textContent =

      selectedConferences.length +

      " conférence(s) · " +

      selectedWorkshops.length +

      " workshop(s) sélectionné(s)";

  }

}

/* =====================================================
   SÉCURITÉ HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =====================================================
   SÉCURITÉ JS
===================================================== */

function escapeJs(
  value
){

  return String(
    value || ""
  )

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    );

}
